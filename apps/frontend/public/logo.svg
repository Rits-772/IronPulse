<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Cyber Neon Gradients -->
    <linearGradient id="neonPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" />
      <stop offset="50%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="cyberPlateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>

    <linearGradient id="glowBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#39FF14" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Hexagonal Shield Frame -->
  <polygon 
    points="256,24 456,120 456,392 256,488 56,392 56,120" 
    fill="url(#cyberPlateGrad)" 
    stroke="url(#glowBorderGrad)" 
    stroke-width="6" 
    stroke-linejoin="round"
  />

  <!-- Inner Hexagon Circuit Inset -->
  <polygon 
    points="256,48 432,132 432,380 256,464 80,380 80,132" 
    fill="none" 
    stroke="#ffffff" 
    stroke-opacity="0.06" 
    stroke-width="2" 
    stroke-dasharray="8 8" 
  />

  <!-- Corner Tech Accents -->
  <path d="M72,140 L96,128 L96,156" stroke="#39FF14" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M440,140 L416,128 L416,156" stroke="#00F0FF" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M72,372 L96,384 L96,356" stroke="#00F0FF" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M440,372 L416,384 L416,356" stroke="#39FF14" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Geometric Central Motif: The Kinetic Iron "IP" & Pulse Wave -->
  
  <!-- Left Weight Plate / 'I' Wing -->
  <path 
    d="M148,168 L188,148 L188,364 L148,344 Z" 
    fill="url(#cyberPlateGrad)" 
    stroke="#39FF14" 
    stroke-width="4" 
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />
  <line x1="168" y1="184" x2="168" y2="328" stroke="#39FF14" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Right Weight Plate / 'P' Wing -->
  <path 
    d="M324,148 L364,168 L364,344 L324,364 Z" 
    fill="url(#cyberPlateGrad)" 
    stroke="#00F0FF" 
    stroke-width="4" 
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />
  <line x1="344" y1="184" x2="344" y2="328" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Center Barbell Core / Kinetic 'P' Crest -->
  <path 
    d="M216,136 L300,136 C344,136 364,164 364,204 C364,244 340,268 296,268 L260,268 L260,376 L216,376 Z" 
    fill="url(#cyberPlateGrad)" 
    stroke="url(#neonPulseGrad)" 
    stroke-width="6" 
    stroke-linejoin="round"
    filter="url(#cyberGlow)"
  />

  <!-- 'P' Cutout Void -->
  <path 
    d="M260,180 L292,180 C312,180 324,190 324,204 C324,218 312,228 292,228 L260,228 Z" 
    fill="#0B0C10" 
    stroke="#39FF14" 
    stroke-width="3"
  />

  <!-- Kinetic Lightning / Heartbeat Pulse Wave Overlay -->
  <polyline 
    points="96,256 160,256 192,216 224,304 256,192 288,320 320,236 352,256 416,256" 
    fill="none" 
    stroke="url(#neonPulseGrad)" 
    stroke-width="6" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    filter="url(#cyberGlow)"
  />

  <!-- High-Energy Pulse Core Nodes -->
  <circle cx="256" cy="192" r="6" fill="#FFFFFF" filter="url(#cyberGlow)" />
  <circle cx="256" cy="192" r="3" fill="#39FF14" />

  <circle cx="224" cy="304" r="5" fill="#00F0FF" filter="url(#softGlow)" />
  <circle cx="288" cy="320" r="5" fill="#39FF14" filter="url(#softGlow)" />

  <!-- Top Vertex Crown Light -->
  <circle cx="256" cy="24" r="4" fill="#39FF14" filter="url(#cyberGlow)" />
  <!-- Bottom Vertex Light -->
  <circle cx="256" cy="488" r="4" fill="#00F0FF" filter="url(#cyberGlow)" />
</svg>